name: search
# Manual launch only (Actions tab -> search -> Run workflow), to control minutes.
# Private repo on GitHub Free = 2000 min/month; cost of one launch = (#v values) x (#seeds) x minutes.
on:
  workflow_dispatch:
    inputs:
      n:        { description: "uniformity n", default: "6" }
      v_list:   { description: "vertex counts, comma separated", default: "21,22,23,24" }
      group:    { description: "cyclic | none (used when group_files is empty)", default: "cyclic" }
      group_files: { description: "group JSON files, comma separated (e.g. groups/blocks_3_4d4.json)", default: "" }
      state_from: { description: "run id to resume from (reuses its saved colourings)", default: "" }
      record:   { description: "current best known upper bound for m(n)", default: "147" }
      seeds:    { description: "seeds, comma separated", default: "0" }
      minutes:  { description: "minutes per job (max 340)", default: "45" }
      iter_time: { description: "seconds per master ILP", default: "300" }

permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          vs = [int(x) for x in "${{ inputs.v_list }}".split(",") if x.strip()]
          ss = [int(x) for x in "${{ inputs.seeds }}".split(",") if x.strip()]
          gs = [x.strip() for x in "${{ inputs.group_files }}".split(",") if x.strip()] or [""]
          print("matrix=" + json.dumps({"gf": gs, "v": vs, "seed": ss}))
          EOF

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      NAME: res-n${{ inputs.n }}-v${{ matrix.v }}-s${{ matrix.seed }}-g${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy scipy python-sat
      - run: make
      - name: resume state
        if: inputs.state_from != ''
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh run download ${{ inputs.state_from }} -n "$NAME" -D out
      - name: cegar
        run: |
          mkdir -p out
          G="--group ${{ inputs.group }}"; [ -n "${{ matrix.gf }}" ] && G="--group-file ${{ matrix.gf }}"
          T=$(( ${{ inputs.minutes }} * 60 - 240 ))
          python3 search/cegar.py --n ${{ inputs.n }} --v ${{ matrix.v }} \
            $G --state out/state.json --record ${{ inputs.record }} \
            --seed ${{ matrix.seed }} --time $T --iter-time ${{ inputs.iter_time }} \
            --out out | tee out/log_v${{ matrix.v }}_s${{ matrix.seed }}.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.NAME }}
          path: out/
          retention-days: 30

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art }
      - run: pip install numpy scipy python-sat && make
      - name: tools for certification
        continue-on-error: true
        run: |
          sudo apt-get update -qq && (sudo apt-get install -y -qq cadical || true)
          if ! command -v cadical; then
            git clone --depth 1 https://github.com/arminbiere/cadical /tmp/cadical
            (cd /tmp/cadical && ./configure && make -j4) && sudo cp /tmp/cadical/build/cadical /usr/local/bin/
          fi
          git clone --depth 1 https://github.com/marijnheule/drat-trim /tmp/drat-trim
          (cd /tmp/drat-trim && gcc -O2 -std=gnu11 -Wno-implicit-function-declaration drat-trim.c -o drat-trim) \
            && sudo cp /tmp/drat-trim/drat-trim /usr/local/bin/ || echo "drat-trim build failed: brute-force certification only"
      - name: summarise + certify record-breakers
        run: |
          RUN=results/run_${{ github.run_id }}_n${{ inputs.n }}
          mkdir -p "$RUN"
          find art -name 'n*.json' -exec cp {} "$RUN/" \;
          find art -name '*.txt' -exec cp {} "$RUN/" \;
          python3 - "$RUN" <<'EOF' | tee "$RUN/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
          import json, glob, sys
          rows = [json.load(open(p)) for p in sorted(glob.glob(sys.argv[1] + "/*.json"))]
          print(f"| group | v | seed | status | edges | beats record | last master cost | optimal |")
          print("|---|---|---|---|---|---|---|---|")
          for r in rows:
              print(f"| {r['group']} | {r['v']} | {r['seed']} | {r['status']} | {r.get('edges','')} | "
                    f"{r.get('beats_record','')} | {r.get('last_master_cost','')} | {r.get('last_master_optimal','')} |")
          EOF
          for f in "$RUN"/n*_E*.txt; do
            [ -e "$f" ] || continue
            E=$(echo "$f" | sed -E 's/.*_E([0-9]+)\.txt/\1/')
            if [ "$E" -lt "${{ inputs.record }}" ]; then
              echo "!!! certifying $f" | tee -a "$RUN/SUMMARY.md"
              bash verify/certify.sh "$f" "$RUN/cert_E$E" | tee -a "$RUN/SUMMARY.md"
            fi
          done
      - name: commit results (results branch)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin results:results 2>/dev/null; then
            git worktree add /tmp/rb results
          else
            git worktree add --orphan -b results /tmp/rb
          fi
          cp -r results/run_* /tmp/rb/
          cd /tmp/rb && git add -A && git commit -q -m "results: run ${{ github.run_id }} n=${{ inputs.n }}" \
            && git push origin results || echo "nothing to commit"
